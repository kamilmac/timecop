[package]
name = "timecop"
version = "0.1.0"
edition = "2021"
description = "AI-native code review TUI"
authors = ["Kamil Macinski"]
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
git2 = { version = "0.19", features = ["vendored-openssl"] }
clap = { version = "4", features = ["derive"] }
arboard = "3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
